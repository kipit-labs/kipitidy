# Merging a change of package.json's version (a release PR) into main tags that
# commit 1.2.3, publishes @kipit-labs/kipitidy@1.2.3 to npm and creates the
# GitHub release. npm trusted publishing (OIDC): no token, provenance included.
name: release

on:
  push:
    branches: [main]
    paths: [package.json]

permissions:
  contents: write
  id-token: write # npm trusted publishing

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # the tags, to check the new version against
      - name: Tag
        id: tag
        run: |
          v=$(jq -r .version package.json)
          echo "version=$v" >> "$GITHUB_OUTPUT"
          if git rev-parse -q --verify "refs/tags/$v" >/dev/null; then
            # A re-run finds its own tag; a tag elsewhere means package.json changed but not its version.
            if [ "$(git rev-list -n1 "$v")" = "$GITHUB_SHA" ]; then exit 0; fi
            echo "skip=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          echo "$v" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$' || { echo "::error::version $v is not X.Y.Z"; exit 1; }
          last=$(git tag -l '[0-9]*.[0-9]*.[0-9]*' | sort -V | tail -1)
          test -z "$last" || test "$(printf '%s\n%s\n' "$last" "$v" | sort -V | tail -1)" = "$v" || { echo "::error::$v is not above $last"; exit 1; }
          git tag "$v" && git push origin "$v"
      - uses: pnpm/action-setup@v4
        if: steps.tag.outputs.skip != 'true'
      - uses: actions/setup-node@v5
        if: steps.tag.outputs.skip != 'true'
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - name: Publish
        if: steps.tag.outputs.skip != 'true'
        run: |
          pnpm install --frozen-lockfile
          v=${{ steps.tag.outputs.version }}
          # A re-run after a published version goes straight to the release.
          if npm view "@kipit-labs/kipitidy@$v" version >/dev/null 2>&1; then exit 0; fi
          npm install -g npm@latest # trusted publishing needs npm >= 11.5.1
          npm publish --access public # prepack builds dist/
      - name: GitHub release
        if: steps.tag.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v=${{ steps.tag.outputs.version }}
          gh release view "$v" >/dev/null 2>&1 || gh release create "$v" --generate-notes --verify-tag
